version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sixsortinghat_postgres
    environment:
      POSTGRES_USER: sixsortinghat
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sixsortinghat
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init_scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sixsortinghat -d sixsortinghat"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sixsortinghat_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --save 20 1 --loglevel warning

volumes:
  postgres_data:
  redis_data: