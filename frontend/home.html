<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SixSortingHat - 홈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-item {
            transition: all 0.2s ease-in-out;
        }
        .chat-item:hover {
            background-color: #f8f9fa;
            transform: translateX(2px);
        }
        .chat-preview {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header-shadow {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .new-chat-button {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.3);
            transition: all 0.2s ease-in-out;
        }
        .new-chat-button:hover {
            box-shadow: 0 6px 20px rgba(251, 191, 36, 0.4);
            transform: translateY(-1px);
        }
        .empty-state {
            opacity: 0.6;
        }
    </style>
</head>
<body class="h-full bg-gray-50">
    <div class="flex flex-col h-screen max-w-md mx-auto bg-white">
        <!-- Header -->
        <div class="bg-yellow-300 py-4 px-4 flex items-center justify-between header-shadow relative z-10">
            <div class="flex items-center">
                <div class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center mr-3">
                    <span class="text-xl">S</span>
                </div>
                <h1 class="font-semibold text-gray-800 text-lg">SixSortingHat</h1>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="showAbout()" class="p-2 hover:bg-white/20 rounded-full transition-colors">
                    <span class="text-gray-700">ℹ️</span>
                </button>
                <button onclick="clearAllChats()" class="p-2 hover:bg-white/20 rounded-full transition-colors">
                    <span class="text-gray-700">🗑️</span>
                </button>
            </div>
        </div>

        <!-- New Chat Button -->
        <div class="p-4">
            <button onclick="startNewChat()" class="new-chat-button w-full py-4 px-6 rounded-2xl text-white font-semibold flex items-center justify-center space-x-2">
                <span class="text-xl">+</span>
                <span>새로운 대화 시작하기</span>
            </button>
        </div>

        <!-- Chat List -->
        <div class="flex-1 px-4 pb-4 overflow-y-auto">
            <div class="mb-3">
                <h2 class="text-sm font-medium text-gray-600 px-2">최근 대화</h2>
            </div>
            <div id="chatList" class="space-y-2">
                <!-- Chat items will be populated here -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="text-center py-12 empty-state">
                <div class="w-16 h-16 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <span class="text-2xl">💭</span>
                </div>
                <h3 class="text-lg font-medium text-gray-700 mb-2">아직 대화가 없습니다</h3>
                <p class="text-gray-500 text-sm px-4">위의 버튼을 눌러 첫 번째 대화를 시작해보세요!</p>
            </div>
        </div>
    </div>

    <!-- About Modal -->
    <div id="aboutModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-6 m-4 max-w-sm">
            <div class="text-center mb-4">
                <div class="w-12 h-12 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-3">
                    <span class="text-2xl">S</span>
                </div>
                <h3 class="text-lg font-semibold text-gray-800">여섯 색깔 모자 사고 기법</h3>
            </div>
            <div class="text-sm text-gray-600 space-y-2 mb-6">
                <p>에드워드 드 보노의 6색깔 모자 사고법을 AI로 구현한 토론 시스템입니다.</p>
                <div class="bg-gray-50 p-3 rounded-lg">
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div>🤍 객관적 정보</div>
                        <div>❤️ 감정과 직감</div>
                        <div>🖤 비판적 사고</div>
                        <div>💛 긍정적 측면</div>
                        <div>💚 창의적 아이디어</div>
                        <div>💙 사고 과정 관리</div>
                    </div>
                </div>
            </div>
            <button onclick="hideAbout()" class="w-full bg-yellow-300 text-gray-800 py-3 rounded-lg font-medium">
                확인
            </button>
        </div>
    </div>

    <script>
        // Chat Manager Class
        class ChatManager {
            constructor() {
                this.chats = this.loadChats();
                this.initializeUI();
            }

            loadChats() {
                const saved = localStorage.getItem('sixhat_chats');
                return saved ? JSON.parse(saved) : [];
            }

            saveChats() {
                localStorage.setItem('sixhat_chats', JSON.stringify(this.chats));
            }

            generateChatId() {
                return 'chat_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            }

            createChat(question) {
                const chatId = this.generateChatId();
                const chat = {
                    id: chatId,
                    title: this.generateTitle(question),
                    question: question,
                    created: new Date().toISOString(),
                    updated: new Date().toISOString(),
                    messages: [],
                    status: 'created'
                };

                this.chats.unshift(chat);
                this.saveChats();
                return chat;
            }

            generateTitle(question) {
                // 간단한 제목 생성 로직
                const maxLength = 30;
                if (question.length <= maxLength) {
                    return question;
                }
                return question.substring(0, maxLength) + '...';
            }

            deleteChat(chatId) {
                this.chats = this.chats.filter(chat => chat.id !== chatId);
                this.saveChats();
                this.renderChatList();
            }

            clearAllChats() {
                if (confirm('모든 토론을 삭제하시겠습니까?')) {
                    this.chats = [];
                    this.saveChats();
                    this.renderChatList();
                }
            }

            initializeUI() {
                this.renderChatList();
            }

            renderChatList() {
                const chatList = document.getElementById('chatList');
                const emptyState = document.getElementById('emptyState');

                if (this.chats.length === 0) {
                    chatList.innerHTML = '';
                    emptyState.style.display = 'block';
                    return;
                }

                emptyState.style.display = 'none';
                chatList.innerHTML = this.chats.map(chat => this.renderChatItem(chat)).join('');
            }

            renderChatItem(chat) {
                const date = new Date(chat.updated);
                const timeAgo = this.getTimeAgo(date);

                return `
                    <div class="chat-item bg-white border border-gray-200 rounded-2xl p-4 cursor-pointer"
                         onclick="openChat('${chat.id}')">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-medium text-gray-800 text-sm flex-1 pr-2">${this.escapeHtml(chat.title)}</h3>
                            <button onclick="event.stopPropagation(); deleteChat('${chat.id}')"
                                    class="text-gray-400 hover:text-red-500 transition-colors text-xs">
                                ✕
                            </button>
                        </div>
                        <p class="text-xs text-gray-500 chat-preview">${this.escapeHtml(chat.question)}</p>
                        <div class="flex items-center justify-between mt-3">
                            <span class="text-xs text-gray-400">${timeAgo}</span>
                            <div class="flex items-center space-x-1">
                                ${this.getStatusIcon(chat.status)}
                                <span class="text-xs text-gray-400">${this.getStatusText(chat.status)}</span>
                            </div>
                        </div>
                    </div>
                `;
            }

            getTimeAgo(date) {
                const now = new Date();
                const diff = now - date;
                const minutes = Math.floor(diff / 60000);
                const hours = Math.floor(minutes / 60);
                const days = Math.floor(hours / 24);

                if (days > 0) return `${days}일 전`;
                if (hours > 0) return `${hours}시간 전`;
                if (minutes > 0) return `${minutes}분 전`;
                return '방금 전';
            }

            getStatusIcon(status) {
                const icons = {
                    'created': '⏳',
                    'in_progress': '🎭',
                    'completed': '✅',
                    'error': '❌'
                };
                return icons[status] || '⏳';
            }

            getStatusText(status) {
                const texts = {
                    'created': '대기중',
                    'in_progress': '토론중',
                    'completed': '완료',
                    'error': '오류'
                };
                return texts[status] || '대기중';
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // Global instances
        let chatManager;

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            chatManager = new ChatManager();
        });

        // Global functions
        function startNewChat() {
            // Navigate to chat page with new chat mode
            window.location.href = '/app/chat.html?mode=new';
        }

        function openChat(chatId) {
            // Navigate to chat page with existing chat
            window.location.href = `/app/chat.html?chatId=${chatId}`;
        }

        function deleteChat(chatId) {
            chatManager.deleteChat(chatId);
        }

        function clearAllChats() {
            chatManager.clearAllChats();
        }

        function showAbout() {
            document.getElementById('aboutModal').classList.remove('hidden');
            document.getElementById('aboutModal').classList.add('flex');
        }

        function hideAbout() {
            document.getElementById('aboutModal').classList.add('hidden');
            document.getElementById('aboutModal').classList.remove('flex');
        }

        // Handle back button for history
        window.addEventListener('popstate', function(event) {
            if (event.state && event.state.page === 'home') {
                // Refresh chat list when coming back to home
                chatManager.renderChatList();
            }
        });

        // Set initial state
        history.replaceState({page: 'home'}, 'Home', 'home.html');
    </script>
</body>
</html>
