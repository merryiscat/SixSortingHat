<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SixSortingHat - 채팅</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }

        /* 6모자별 색상 시스템 */
        .hat-white { --hat-color: #FFFFFF; --hat-bg: #F8FAFC; --hat-border: #E2E8F0; --hat-text: #1A202C; }
        .hat-red { --hat-color: #EF4444; --hat-bg: #FEF2F2; --hat-border: #FECACA; --hat-text: #991B1B; }
        .hat-black { --hat-color: #374151; --hat-bg: #F9FAFB; --hat-border: #D1D5DB; --hat-text: #111827; }
        .hat-yellow { --hat-color: #F59E0B; --hat-bg: #FFFBEB; --hat-border: #FDE68A; --hat-text: #92400E; }
        .hat-green { --hat-color: #10B981; --hat-bg: #ECFDF5; --hat-border: #A7F3D0; --hat-text: #065F46; }
        .hat-blue { --hat-color: #3B82F6; --hat-bg: #EFF6FF; --hat-border: #BFDBFE; --hat-text: #1E40AF; }

        .hat-bubble {
            background-color: var(--hat-bg);
            border: 2px solid var(--hat-border);
            color: var(--hat-text);
            border-radius: 20px;
            max-width: 85%;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .hat-bubble:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px -3px rgba(0, 0, 0, 0.1);
        }

        .hat-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px solid var(--hat-color);
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--hat-bg);
            font-weight: 600;
            font-size: 18px;
            color: var(--hat-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            space-x: 1;
        }

        .typing-dot {
            height: 8px;
            width: 8px;
            border-radius: 50%;
            background-color: var(--hat-color);
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* 타이핑 커서 애니메이션 */
        .typing-cursor {
            animation: blink 1s infinite;
            color: #666;
            font-weight: bold;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .coin-indicator {
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            box-shadow: 0 4px 6px -1px rgba(245, 158, 11, 0.3);
        }

        .question-input {
            background: linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 100%);
            border: 2px solid #BFDBFE;
            border-radius: 16px;
            padding: 16px 20px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .question-input:focus {
            outline: none;
            border-color: #3B82F6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .send-button {
            background: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%);
            border-radius: 16px;
            padding: 16px 24px;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);
        }

        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px -3px rgba(59, 130, 246, 0.3);
        }

        .send-button:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }

        .progress-bar {
            height: 4px;
            background: linear-gradient(90deg,
                #FFFFFF 0%, #EF4444 16.66%, #374151 33.33%,
                #F59E0B 50%, #10B981 66.66%, #3B82F6 83.33%, #3B82F6 100%);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: rgba(255, 255, 255, 0.3);
            transition: width 0.5s ease;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <div class="max-w-md mx-auto bg-white h-screen flex flex-col">
        <!-- Header -->
        <div class="bg-yellow-300 py-4 px-4 flex items-center justify-between header-shadow relative z-10">
            <div class="flex items-center">
                <button onclick="goBack()" class="p-2 hover:bg-white/20 rounded-full transition-colors mr-2">
                    <span class="text-gray-700">←</span>
                </button>
                <div class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center mr-3">
                    <span class="text-xl">🎩</span>
                </div>
                <div>
                    <h1 class="font-semibold text-gray-800" id="chatTitle">6모자 토론</h1>
                    <span class="text-xs text-gray-600" id="chatStatus">준비 중...</span>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="saveChat()" class="p-2 hover:bg-white/20 rounded-full transition-colors">
                    <span class="text-gray-700">💾</span>
                </button>
            </div>
        </div>


        <!-- Progress Bar -->
        <div class="bg-gray-50 px-4 py-2 border-b">
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar" style="width: 0%"></div>
            </div>
            <p class="text-gray-600 text-xs mt-1" id="progressText">질문을 시작해보세요</p>
        </div>

        <!-- Chat Messages -->
        <div class="flex-1 overflow-y-auto p-4 bg-gray-50" id="chatMessages">
            <!-- Date Divider -->
            <div class="flex justify-center my-4">
                <span class="bg-gray-200 text-xs px-2 py-1 rounded-full">Today</span>
            </div>

            <!-- Welcome Message -->
            <div class="flex mb-4">
                <div class="w-8 h-8 bg-yellow-400 rounded-full flex items-center justify-center mr-2">
                    <span class="text-white text-sm">🎩</span>
                </div>
                <div>
                    <div class="text-xs text-gray-500 mb-1">6모자 시스템, 방금</div>
                    <div class="bg-white p-3 rounded-r-lg rounded-bl-lg shadow-sm max-w-xs">
                        안녕하세요! 6가지 관점에서 여러분의 질문을 분석해드리는 AI 토론 시스템입니다. 궁금한 것을 물어보세요!
                    </div>
                </div>
            </div>
        </div>

        <!-- Message Input -->
        <div class="p-3 bg-white border-t border-gray-200">
            <div class="flex items-center">
                <i data-feather="plus-circle" class="w-6 h-6 text-gray-500 mr-2"></i>
                <input
                    type="text"
                    id="questionInput"
                    placeholder="질문을 입력하세요..."
                    class="flex-1 border border-gray-300 rounded-full py-2 px-4 focus:outline-none focus:border-yellow-400"
                    maxlength="500"
                    onkeypress="handleKeyPress(event)"
                >
                <button
                    id="sendButton"
                    onclick="sendQuestion()"
                    class="ml-2 bg-yellow-400 rounded-full p-2 disabled:bg-gray-300"
                    disabled
                >
                    <i data-feather="send" class="w-5 h-5 text-white"></i>
                </button>
            </div>
            <div class="text-right mt-1">
                <span id="charCount" class="text-xs text-gray-500">0/500</span>
            </div>
        </div>
    </div>

    <script>
        // 전역 변수 (window 객체에 명시적으로 할당)
        let sessionId = null;
        let currentHat = 0;
        let isDiscussing = false;
        let isSessionReady = false;
        let currentChatId = null;
        let currentQuestion = '';
        let chatMessages = [];

        // window 객체에도 할당하여 디버깅 가능하게 함
        window.sessionId = sessionId;
        window.currentHat = currentHat;
        window.isDiscussing = isDiscussing;
        window.isSessionReady = isSessionReady;
        window.currentChatId = currentChatId;
        window.currentQuestion = currentQuestion;
        window.chatMessages = chatMessages;
        const hats = [
            { name: '하얀 모자', emoji: '⚪', class: 'hat-white', role: '객관적 정보 분석' },
            { name: '빨간 모자', emoji: '🔴', class: 'hat-red', role: '감정과 직감' },
            { name: '검은 모자', emoji: '⚫', class: 'hat-black', role: '비판적 분석' },
            { name: '노란 모자', emoji: '🟡', class: 'hat-yellow', role: '긍정적 측면' },
            { name: '초록 모자', emoji: '🟢', class: 'hat-green', role: '창의적 아이디어' },
            { name: '파란 모자', emoji: '🔵', class: 'hat-blue', role: '토론 관리' }
        ];

        // 페이지 로드 시 초기화
        window.onload = function() {
            feather.replace();
            initializeChatFromUrl();
            createSession();
            setupInputHandlers();

            // 라우팅 초기화 (새로 추가)
            if (typeof initializeChat === 'function') {
                initializeChat();
            }
        };

        // URL에서 채팅 정보 초기화
        function initializeChatFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const mode = urlParams.get('mode');
            const chatId = urlParams.get('chatId');

            if (mode === 'new') {
                // 새로운 채팅
                currentChatId = generateChatId();
                currentQuestion = '';
                chatMessages = [];
                updateChatTitle('새로운 대화');
            } else if (chatId) {
                // 기존 채팅 불러오기
                loadExistingChat(chatId);
            }

            window.currentChatId = currentChatId;
            window.currentQuestion = currentQuestion;
            window.chatMessages = chatMessages;
        }

        // 채팅 ID 생성
        function generateChatId() {
            return 'chat_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        // 채팅 제목 업데이트
        function updateChatTitle(title) {
            const titleElement = document.getElementById('chatTitle');
            if (titleElement) {
                titleElement.textContent = title;
            }
        }

        // 입력 핸들러 설정
        function setupInputHandlers() {
            const input = document.getElementById('questionInput');
            const button = document.getElementById('sendButton');
            const charCount = document.getElementById('charCount');

            input.addEventListener('input', function() {
                const length = this.value.length;
                charCount.textContent = `${length}/500`;
                updateSendButton();

                if (length > 450) {
                    charCount.classList.add('text-red-500');
                } else {
                    charCount.classList.remove('text-red-500');
                }
            });
        }

        // 엔터키 처리 (전역 함수로 이동)
        window.handleKeyPress = function(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendQuestion();
            }
        };

        // 전송 버튼 상태 업데이트
        function updateSendButton() {
            const input = document.getElementById('questionInput');
            const button = document.getElementById('sendButton');
            const hasText = input.value.trim().length > 0;

            button.disabled = !hasText || !isSessionReady || isDiscussing;

            // 버튼 텍스트 업데이트
            if (!isSessionReady) {
                button.textContent = '연결 중...';
            } else if (isDiscussing) {
                button.textContent = '분석 중...';
            } else {
                button.textContent = '질문하기';
            }
        }

        // 세션 생성 (코인 시스템 제거)
        async function createSession() {
            try {
                // 클라이언트에서 세션 ID 생성 (서버 의존성 제거)
                sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                isSessionReady = true;
                isDiscussing = false;

                // window 객체도 동기화
                window.sessionId = sessionId;
                window.isSessionReady = isSessionReady;
                window.isDiscussing = isDiscussing;

                updateSendButton();
                console.log('세션 준비 완료:', sessionId);
                addSystemMessage('✅ 토론 준비가 완료되었습니다. 궁금한 것을 물어보세요!');
            } catch (error) {
                console.error('세션 준비 오류:', error);
                isSessionReady = false;
                window.isSessionReady = isSessionReady;
                updateSendButton();
                addSystemMessage('⚠️ 연결에 문제가 있습니다. 페이지를 새로고침해주세요.');
            }
        }

        // 질문 전송
        async function sendQuestion() {
            const input = document.getElementById('questionInput');
            const question = input.value.trim();

            if (!question || isDiscussing || !sessionId || !isSessionReady) return;

            // 현재 질문 저장
            currentQuestion = question;
            window.currentQuestion = currentQuestion;

            // 채팅 제목 업데이트 (첫 질문인 경우)
            if (chatMessages.length === 0) {
                const title = generateChatTitle(question);
                updateChatTitle(title);
            }

            // UI 업데이트
            addUserMessage(question);
            input.value = '';
            document.getElementById('charCount').textContent = '0/500';
            isDiscussing = true;
            window.isDiscussing = isDiscussing;
            updateSendButton();

            // 6모자 분석 시작
            startDiscussion(question);
        }

        // 6모자 분석 시작
        async function startDiscussion(question) {
            currentHat = 0;
            updateProgress(0, '6모자가 준비 중입니다...');

            try {
                // GET 방식으로 스트리밍 시작 (한글 인코딩 적용)
                const encodedQuestion = encodeURIComponent(question);
                const encodedSessionId = encodeURIComponent(sessionId);
                const response = await fetch(`http://localhost:8000/api/v1/discussions/stream?question=${encodedQuestion}&session_id=${encodedSessionId}`);

                if (!response.ok) {
                    throw new Error('스트리밍 시작 실패');
                }

                // SSE 스트림 처리
                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.substring(6));
                                handleDiscussionEvent(data);
                            } catch (error) {
                                console.error('이벤트 파싱 오류:', error);
                            }
                        }
                    }
                }

                // 분석 완료
                finishDiscussion();

            } catch (error) {
                console.error('분석 시작 오류:', error);
                addSystemMessage('❌ 분석을 시작할 수 없습니다.');
                finishDiscussion();
            }
        }

        // 타이핑 효과 관련 변수들
        const typingStates = {};

        // 6모자 분석 이벤트 처리
        function handleDiscussionEvent(data) {
            switch (data.type) {
                case 'discussion_started':
                    updateProgress(10, '6모자 분석이 시작되었습니다');
                    break;

                case 'intent_classified':
                    updateProgress(20, '질문을 분석 중입니다');
                    break;

                case 'hat_response_start':
                    handleHatResponseStart(data);
                    break;

                case 'hat_response_chunk':
                    handleHatResponseChunk(data);
                    break;

                case 'hat_response_complete':
                    handleHatResponseComplete(data);
                    break;

                case 'hat_completed':
                    // 기존 방식과 새로운 타이핑 효과 방식 둘 다 지원
                    if (data.hat && data.hat.color) {
                        // 새로운 타이핑 효과 방식으로 처리
                        simulateTypingEffect(data);
                    } else {
                        // 기존 방식
                        handleHatResponse(data);
                    }
                    break;

                case 'quality_checked':
                    updateProgress(90, '결과를 검증 중입니다');
                    break;

                case 'final_response':
                    handleFinalResponse(data);
                    break;

                case 'discussion_completed':
                    finishDiscussion();
                    break;

                case 'error':
                    // 세션 만료 시 자동 재생성
                    if (data.error.includes('유효하지 않은 세션')) {
                        addSystemMessage('세션이 만료되었습니다. 새 세션을 생성 중...');
                        isSessionReady = false;
                        sessionId = null;
                        updateSendButton();
                        createSession(); // 자동으로 새 세션 생성
                    } else {
                        addSystemMessage(`오류: ${data.error}`);
                    }
                    finishDiscussion();
                    break;
            }
        }

        // 모자 응답 시작 처리
        function handleHatResponseStart(data) {
            const hatColor = data.hat.color;
            const hatName = data.hat.name;

            // 진행 상황 업데이트
            const progressMap = {
                'white': 30,
                'red': 40,
                'black': 50,
                'yellow': 60,
                'green': 70,
                'blue': 80
            };
            updateProgress(progressMap[hatColor] || 50, `${hatName} 분석 중`);

            // 메시지 컨테이너 생성
            const messageElement = addHatMessage(hatColor, '', hatName, '분석 중...');
            const contentElement = messageElement.querySelector('.hat-content');

            // 타이핑 상태 초기화
            typingStates[hatColor] = {
                element: contentElement,
                fullContent: '',
                currentContent: '',
                isTyping: false,
                messageElement: messageElement
            };

            // 타이핑 커서 표시
            contentElement.innerHTML = '<span class="typing-cursor">|</span>';
        }

        // 모자 응답 청크 처리 (타이핑 효과)
        function handleHatResponseChunk(data) {
            const hatColor = data.hat.color;
            const chunk = data.chunk;

            if (!typingStates[hatColor]) return;

            const state = typingStates[hatColor];
            state.fullContent += chunk;

            if (!state.isTyping) {
                state.isTyping = true;
                startTypingEffect(hatColor);
            }
        }

        // 타이핑 효과 시작
        function startTypingEffect(hatColor) {
            const state = typingStates[hatColor];
            if (!state || !state.element) return;

            const typeNextChar = () => {
                if (state.currentContent.length < state.fullContent.length) {
                    state.currentContent = state.fullContent.substring(0, state.currentContent.length + 1);
                    state.element.innerHTML = escapeHtml(state.currentContent) + '<span class="typing-cursor">|</span>';

                    // 스크롤 업데이트
                    scrollToBottom();

                    // 다음 글자 타이핑 (속도 조절)
                    setTimeout(typeNextChar, 30);
                } else {
                    // 타이핑 완료 시 커서 제거
                    state.element.innerHTML = escapeHtml(state.currentContent);
                    state.isTyping = false;
                }
            };

            typeNextChar();
        }

        // 기존 데이터를 이용한 타이핑 효과 시뮬레이션
        function simulateTypingEffect(data) {
            // 기존 데이터에서 모자 정보 추출
            const hat = data.hat;
            const hatColor = hat.color;
            const hatName = hat.name;
            const content = data.content || '';

            // 진행 상황 업데이트
            const progressMap = {
                'white': 30,
                'red': 40,
                'black': 50,
                'yellow': 60,
                'green': 70,
                'blue': 80
            };
            updateProgress(progressMap[hatColor] || 50, `${hatName} 분석 중`);

            // 모자 색상 매핑
            const hatColors = {
                'white': '#9CA3AF',
                'red': '#EF4444',
                'black': '#374151',
                'yellow': '#F59E0B',
                'green': '#10B981',
                'blue': '#3B82F6'
            };

            // 메시지 컨테이너 직접 생성
            const container = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex mb-4';

            messageDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full flex items-center justify-center mr-3 flex-shrink-0"
                     style="background-color: ${hatColors[hatColor]}">
                    <span class="text-white text-sm font-bold">${hatName.charAt(0)}</span>
                </div>
                <div class="flex-1">
                    <div class="flex items-center mb-1">
                        <span class="font-semibold text-gray-800 text-sm">${hatName}</span>
                        <span class="text-xs text-gray-500 ml-2">${hat.role}</span>
                    </div>
                    <div class="hat-content bg-white rounded-2xl px-4 py-3 shadow-sm border border-gray-100">
                        <span class="typing-cursor">|</span>
                    </div>
                </div>
            `;

            container.appendChild(messageDiv);
            const contentElement = messageDiv.querySelector('.hat-content');

            // 타이핑 상태 초기화
            typingStates[hatColor] = {
                element: contentElement,
                fullContent: content,
                currentContent: '',
                isTyping: false,
                messageElement: messageDiv
            };

            // 즉시 타이핑 시작
            setTimeout(() => {
                startTypingEffect(hatColor);
            }, 100);

            // 채팅 기록에 저장
            if (chatMessages && content) {
                chatMessages.push({
                    type: 'hat',
                    hat: hatName,
                    color: hatColor,
                    content: content,
                    timestamp: new Date().toISOString()
                });
            }

            // 스크롤 업데이트
            scrollToBottom();
        }

        // 모자 응답 완료 처리
        function handleHatResponseComplete(data) {
            const hatColor = data.hat.color;
            const hatName = data.hat.name;

            if (typingStates[hatColor]) {
                const state = typingStates[hatColor];

                // 최종 내용 설정
                state.element.innerHTML = escapeHtml(data.content);

                // 채팅 기록에 저장
                if (chatMessages && data.content) {
                    chatMessages.push({
                        type: 'hat',
                        hat: hatName,
                        color: hatColor,
                        content: data.content,
                        timestamp: new Date().toISOString()
                    });
                }

                // 상태 정리
                delete typingStates[hatColor];

                // 스크롤 업데이트
                scrollToBottom();
            }
        }

        // 모자 응답 처리
        function handleHatResponse(data) {
            const hat = data.hat;
            const progress = 20 + (currentHat * 12);

            updateProgress(progress, `${hat.name}이 생각 중입니다...`);

            // 타이핑 인디케이터 표시
            addTypingIndicator(hat);

            setTimeout(() => {
                removeTypingIndicator();
                addHatMessage(hat, data.content);
                currentHat++;
            }, 1000 + Math.random() * 2000); // 1-3초 랜덤 딜레이
        }

        // 최종 응답 처리
        function handleFinalResponse(data) {
            updateProgress(100, '6모자 분석이 완료되었습니다!');

            setTimeout(() => {
                if (data.content) {
                    addFinalSummary(data.content, data.quality_info);
                }
                finishDiscussion();
            }, 1000);
        }

        // 분석 완료
        function finishDiscussion() {
            isDiscussing = false;
            currentHat = 0;
            window.isDiscussing = isDiscussing;
            window.currentHat = currentHat;
            updateSendButton();
            updateProgress(0, '다음 질문을 입력해주세요');

            // 토론 완료 시 채팅 히스토리에 저장
            saveChatToHistory();

            // 코인 시스템 제거됨
        }

        // 메시지 추가 함수들
        function addUserMessage(message) {
            // chatMessages 배열에 기록
            const messageData = {
                type: 'user',
                content: message,
                timestamp: new Date().toISOString()
            };
            chatMessages.push(messageData);
            window.chatMessages = chatMessages;

            const container = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex justify-end mb-4';
            messageDiv.innerHTML = `
                <div>
                    <div class="text-xs text-gray-500 mb-1 text-right">나, ${getCurrentTime()}</div>
                    <div class="bg-yellow-400 text-black p-3 rounded-l-lg rounded-tr-lg max-w-xs shadow-sm">
                        ${escapeHtml(message)}
                    </div>
                </div>
            `;
            container.appendChild(messageDiv);
            scrollToBottom();
        }

        function addHatMessage(hat, content) {
            // chatMessages 배열에 기록
            const messageData = {
                type: 'hat',
                hat: {
                    name: hat.name,
                    emoji: hat.emoji,
                    role: hat.role
                },
                content: content,
                timestamp: new Date().toISOString()
            };
            chatMessages.push(messageData);
            window.chatMessages = chatMessages;

            const container = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex mb-4';

            // 6모자별 색상 매핑
            const hatColors = {
                '하얀 모자': '#9CA3AF',
                '빨간 모자': '#EF4444',
                '검은 모자': '#374151',
                '노란 모자': '#F59E0B',
                '초록 모자': '#10B981',
                '파란 모자': '#3B82F6'
            };

            const avatarColor = hatColors[hat.name] || '#9CA3AF';

            messageDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full mr-2 flex items-center justify-center" style="background-color: ${avatarColor}">
                    <span class="text-white text-sm">${hat.emoji}</span>
                </div>
                <div>
                    <div class="text-xs text-gray-500 mb-1">${hat.name}, ${getCurrentTime()}</div>
                    <div class="bg-white p-3 rounded-r-lg rounded-bl-lg shadow-sm max-w-xs">
                        ${escapeHtml(content).replace(/\n/g, '<br>')}
                    </div>
                </div>
            `;
            container.appendChild(messageDiv);
            scrollToBottom();
        }

        function addTypingIndicator(hat) {
            const container = document.getElementById('chatMessages');
            const typingDiv = document.createElement('div');
            typingDiv.id = 'typingIndicator';
            typingDiv.className = 'flex mb-4';

            // 6모자별 색상 매핑
            const hatColors = {
                '하얀 모자': '#9CA3AF',
                '빨간 모자': '#EF4444',
                '검은 모자': '#374151',
                '노란 모자': '#F59E0B',
                '초록 모자': '#10B981',
                '파란 모자': '#3B82F6'
            };

            const avatarColor = hatColors[hat.name] || '#9CA3AF';

            typingDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full mr-2 flex items-center justify-center" style="background-color: ${avatarColor}">
                    <span class="text-white text-sm">${hat.emoji}</span>
                </div>
                <div>
                    <div class="text-xs text-gray-500 mb-1">${hat.name} 생각 중...</div>
                    <div class="bg-gray-100 p-3 rounded-r-lg rounded-bl-lg max-w-xs">
                        <div class="flex space-x-1">
                            <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div>
                            <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                            <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(typingDiv);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        function addSystemMessage(message) {
            const container = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex justify-center mb-4';
            messageDiv.innerHTML = `
                <span class="bg-gray-200 text-xs px-2 py-1 rounded-full">
                    ${escapeHtml(message)}
                </span>
            `;
            container.appendChild(messageDiv);
            scrollToBottom();
        }

        function addFinalSummary(content, qualityInfo) {
            const container = document.getElementById('chatMessages');
            const summaryDiv = document.createElement('div');
            summaryDiv.className = 'mb-4';
            summaryDiv.innerHTML = `
                <div class="bg-gradient-to-br from-indigo-50 to-blue-50 border-2 border-indigo-200 rounded-2xl p-6 shadow-lg">
                    <div class="flex items-center mb-3">
                        <span class="text-2xl mr-2">📋</span>
                        <span class="font-bold text-indigo-800">6모자 종합 분석</span>
                    </div>
                    <div class="text-gray-700 leading-relaxed mb-4">${escapeHtml(content)}</div>
                    ${qualityInfo ? `
                        <div class="text-xs text-indigo-600 bg-indigo-100 rounded-lg p-2">
                            <strong>품질 점수:</strong> ${qualityInfo.score || 'N/A'}/100
                        </div>
                    ` : ''}
                </div>
            `;
            container.appendChild(summaryDiv);
            scrollToBottom();
        }

        // UI 업데이트 함수들
        function updateProgress(percentage, text) {
            document.getElementById('progressBar').style.width = `${percentage}%`;
            document.getElementById('progressText').textContent = text;
        }

        // updateCoinCount 함수 제거됨 (코인 시스템 제거)

        // 유틸리티 함수들
        function getCurrentTime() {
            return new Date().toLocaleTimeString('ko-KR', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function scrollToBottom() {
            const container = document.getElementById('chatMessages');
            setTimeout(() => {
                container.scrollTop = container.scrollHeight;
            }, 100);
        }

        // 새로고침 버튼 (개발용)
        function refreshSession() {
            if (confirm('새 세션을 시작하시겠습니까?')) {
                location.reload();
            }
        }

        // Routing and Chat Management Functions
        let currentChat = null;

        // Parse URL parameters
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                mode: params.get('mode'),
                chatId: params.get('chatId')
            };
        }

        // Load existing chat from localStorage
        function loadChat(chatId) {
            const chats = JSON.parse(localStorage.getItem('sixhat_chats') || '[]');
            return chats.find(chat => chat.id === chatId);
        }

        // Save chat to localStorage
        function saveCurrentChat() {
            if (!currentChat) return;

            const chats = JSON.parse(localStorage.getItem('sixhat_chats') || '[]');
            const existingIndex = chats.findIndex(chat => chat.id === currentChat.id);

            if (existingIndex >= 0) {
                chats[existingIndex] = currentChat;
            } else {
                chats.unshift(currentChat);
            }

            localStorage.setItem('sixhat_chats', JSON.stringify(chats));
        }

        // Initialize chat based on URL parameters
        function initializeChat() {
            // First, enhance all functions safely
            enhanceFunctions();

            const params = getUrlParams();

            if (params.mode === 'new') {
                // New chat mode
                document.getElementById('chatTitle').textContent = '새로운 대화';
                document.getElementById('chatStatus').textContent = '질문을 입력해주세요';
            } else if (params.chatId) {
                // Load existing chat
                currentChatId = params.chatId;
                currentChat = loadChat(currentChatId);

                if (currentChat) {
                    document.getElementById('chatTitle').textContent = currentChat.title;
                    document.getElementById('chatStatus').textContent = getStatusText(currentChat.status);

                    // Load previous messages using original functions to avoid double-saving
                    if (currentChat.messages && currentChat.messages.length > 0) {
                        currentChat.messages.forEach(message => {
                            if (message.type === 'user' && originalFunctions.addUserMessage) {
                                originalFunctions.addUserMessage(message.content);
                            } else if (message.type === 'system' && originalFunctions.addSystemMessage) {
                                originalFunctions.addSystemMessage(message.content);
                            } else if (message.type === 'hat' && originalFunctions.addHatMessage) {
                                originalFunctions.addHatMessage(message.hat, message.content, message.hatInfo);
                            }
                        });
                    }
                } else {
                    // Chat not found, redirect to home
                    goBack();
                    return;
                }
            } else {
                // No parameters, redirect to home
                goBack();
                return;
            }
        }

        // Create new chat when user sends first message
        function createNewChatFromMessage(question) {
            if (!currentChat) {
                currentChatId = 'chat_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                currentChat = {
                    id: currentChatId,
                    title: generateTitle(question),
                    question: question,
                    created: new Date().toISOString(),
                    updated: new Date().toISOString(),
                    messages: [],
                    status: 'in_progress'
                };

                document.getElementById('chatTitle').textContent = currentChat.title;

                // Update URL without refreshing
                const newUrl = new URL(window.location);
                newUrl.searchParams.set('chatId', currentChatId);
                newUrl.searchParams.delete('mode');
                window.history.replaceState({}, '', newUrl);
            }
        }

        // Add message to current chat
        function addMessageToChat(type, content, extra = {}) {
            if (!currentChat) return;

            const message = {
                type: type,
                content: content,
                timestamp: new Date().toISOString(),
                ...extra
            };

            currentChat.messages.push(message);
            currentChat.updated = new Date().toISOString();
            saveCurrentChat();
        }

        // Store original functions safely
        let originalFunctions = {};

        // Enhanced function override system
        function enhanceFunctions() {
            // Enhanced send question function
            if (typeof sendQuestion === 'function' && !originalFunctions.sendQuestion) {
                originalFunctions.sendQuestion = sendQuestion;
                sendQuestion = async function() {
                    const questionInput = document.getElementById('questionInput');
                    const question = questionInput.value.trim();

                    if (!question || !isSessionReady) return;

                    // Create new chat if this is the first message
                    createNewChatFromMessage(question);

                    // Update chat status
                    if (currentChat) {
                        currentChat.status = 'in_progress';
                        document.getElementById('chatStatus').textContent = '토론 진행 중...';
                        saveCurrentChat();
                    }

                    // Call original send question
                    if (originalFunctions.sendQuestion) {
                        await originalFunctions.sendQuestion.call(this);
                    }
                };
            }

            // Enhanced message functions to save to chat
            if (typeof addUserMessage === 'function' && !originalFunctions.addUserMessage) {
                originalFunctions.addUserMessage = addUserMessage;
                addUserMessage = function(message) {
                    if (originalFunctions.addUserMessage) {
                        originalFunctions.addUserMessage.call(this, message);
                    }
                    addMessageToChat('user', message);
                };
            }

            if (typeof addSystemMessage === 'function' && !originalFunctions.addSystemMessage) {
                originalFunctions.addSystemMessage = addSystemMessage;
                addSystemMessage = function(message) {
                    if (originalFunctions.addSystemMessage) {
                        originalFunctions.addSystemMessage.call(this, message);
                    }
                    addMessageToChat('system', message);
                };
            }

            if (typeof addHatMessage === 'function' && !originalFunctions.addHatMessage) {
                originalFunctions.addHatMessage = addHatMessage;
                addHatMessage = function(hatType, message, hatInfo) {
                    if (originalFunctions.addHatMessage) {
                        originalFunctions.addHatMessage.call(this, hatType, message, hatInfo);
                    }
                    addMessageToChat('hat', message, { hat: hatType, hatInfo: hatInfo });
                };
            }

            // Enhanced SSE completion handler
            if (typeof window.handleEventStreamCompletion === 'function' && !originalFunctions.handleEventStreamCompletion) {
                originalFunctions.handleEventStreamCompletion = window.handleEventStreamCompletion;
                window.handleEventStreamCompletion = function() {
                    if (originalFunctions.handleEventStreamCompletion) {
                        originalFunctions.handleEventStreamCompletion.call(this);
                    }

                    // Update chat status to completed
                    if (currentChat) {
                        currentChat.status = 'completed';
                        document.getElementById('chatStatus').textContent = '토론 완료';
                        saveCurrentChat();
                    }
                };
            }
        }

        // Navigation functions
        function goBack() {
            window.location.href = '/app/home.html';
        }

        function saveChat() {
            if (currentChat) {
                saveCurrentChat();
                addSystemMessage('💾 채팅이 저장되었습니다.');
            }
        }

        // 채팅 히스토리 관리 함수들
        function generateChatTitle(question) {
            const maxLength = 30;
            if (question.length <= maxLength) {
                return question;
            }
            return question.substring(0, maxLength) + '...';
        }

        function saveChatToHistory() {
            if (!currentChatId || !currentQuestion || chatMessages.length === 0) {
                return;
            }

            // 기존 채팅 목록 불러오기
            const existingChats = JSON.parse(localStorage.getItem('sixhat_chats') || '[]');

            // 새 채팅 데이터 생성
            const chatData = {
                id: currentChatId,
                title: generateChatTitle(currentQuestion),
                question: currentQuestion,
                created: new Date().toISOString(),
                updated: new Date().toISOString(),
                messages: chatMessages,
                status: 'completed'
            };

            // 기존 채팅이 있는지 확인하고 업데이트 또는 추가
            const existingIndex = existingChats.findIndex(chat => chat.id === currentChatId);
            if (existingIndex >= 0) {
                existingChats[existingIndex] = chatData;
            } else {
                existingChats.unshift(chatData); // 최신 채팅을 맨 앞에 추가
            }

            // localStorage에 저장
            localStorage.setItem('sixhat_chats', JSON.stringify(existingChats));

            console.log('채팅이 히스토리에 저장되었습니다:', currentChatId);
        }

        function loadExistingChat(chatId) {
            const existingChats = JSON.parse(localStorage.getItem('sixhat_chats') || '[]');
            const chat = existingChats.find(c => c.id === chatId);

            if (chat) {
                currentChatId = chat.id;
                currentQuestion = chat.question;
                chatMessages = chat.messages || [];

                updateChatTitle(chat.title);
                loadMessagesFromHistory(chatMessages);

                window.currentChatId = currentChatId;
                window.currentQuestion = currentQuestion;
                window.chatMessages = chatMessages;
            }
        }

        function loadMessagesFromHistory(messages) {
            const container = document.getElementById('chatMessages');
            // 기존 메시지 제거 (환영 메시지 제외)
            const welcomeMessage = container.querySelector('.flex.mb-4');
            container.innerHTML = '';
            if (welcomeMessage) {
                container.appendChild(welcomeMessage);
            }

            // 히스토리에서 메시지 복원
            messages.forEach(msg => {
                if (msg.type === 'user') {
                    addUserMessageFromHistory(msg.content, msg.timestamp);
                } else if (msg.type === 'hat') {
                    addHatMessageFromHistory(msg.hat, msg.content, msg.timestamp);
                }
            });
        }

        function addUserMessageFromHistory(message, timestamp) {
            const container = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex justify-end mb-4';
            messageDiv.innerHTML = `
                <div>
                    <div class="text-xs text-gray-500 mb-1 text-right">나, ${formatTimestamp(timestamp)}</div>
                    <div class="bg-yellow-400 text-black p-3 rounded-l-lg rounded-tr-lg max-w-xs shadow-sm">
                        ${escapeHtml(message)}
                    </div>
                </div>
            `;
            container.appendChild(messageDiv);
        }

        function addHatMessageFromHistory(hat, content, timestamp) {
            const container = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex mb-4';

            const hatColors = {
                '하얀 모자': '#9CA3AF',
                '빨간 모자': '#EF4444',
                '검은 모자': '#374151',
                '노란 모자': '#F59E0B',
                '초록 모자': '#10B981',
                '파란 모자': '#3B82F6'
            };

            const avatarColor = hatColors[hat.name] || '#9CA3AF';

            messageDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full mr-2 flex items-center justify-center" style="background-color: ${avatarColor}">
                    <span class="text-white text-sm">${hat.emoji}</span>
                </div>
                <div>
                    <div class="text-xs text-gray-500 mb-1">${hat.name}, ${formatTimestamp(timestamp)}</div>
                    <div class="bg-white p-3 rounded-r-lg rounded-bl-lg shadow-sm max-w-xs">
                        ${escapeHtml(content).replace(/\n/g, '<br>')}
                    </div>
                </div>
            `;
            container.appendChild(messageDiv);
        }

        function formatTimestamp(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString('ko-KR', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Helper functions
        function generateTitle(question) {
            const maxLength = 30;
            if (question.length <= maxLength) {
                return question;
            }
            return question.substring(0, maxLength) + '...';
        }

        function getStatusText(status) {
            const texts = {
                'created': '대기중',
                'in_progress': '토론중',
                'completed': '완료',
                'error': '오류'
            };
            return texts[status] || '대기중';
        }
    </script>
</body>
</html>
